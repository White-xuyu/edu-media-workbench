<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; }
  .cover {
    width:1080px; height:1350px;
    background:#1a1a1a; color:#fff;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    position:relative; overflow:hidden;
    display:flex; flex-direction:column; padding:96px 88px 76px;
  }
  .bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .mask{ position:absolute; inset:0; background:rgba(0,0,0,.45); }
  .note{
    position:absolute; top:150px; right:64px; z-index:3; width:210px;
    background:#FFF9C4; color:#3b3b2e; padding:24px 22px;
    transform:rotate(5deg); box-shadow:0 6px 16px rgba(0,0,0,.28);
    font-family:"KaiTi","STKaiti","华文行楷",cursive; font-size:28px; line-height:1.5;
  }
  .note::before{
    content:""; position:absolute; top:-16px; left:50%; transform:translateX(-50%) rotate(-3deg);
    width:96px; height:30px; background:rgba(255,255,255,.55);
  }
  .tag{
    align-self:flex-start; position:relative; z-index:2;
    color:#fff; font-size:26px; font-weight:500; letter-spacing:.3em;
    padding:10px 0; border-bottom:1px solid rgba(255,255,255,.65);
  }
  .mid{ margin-top:auto; position:relative; z-index:2; text-align:left; }
  .title{
    font-size:96px; line-height:1.18; font-weight:700; letter-spacing:.01em;
    color:#FFFFFF; max-width:860px;
  }
  .rule{ width:72px; height:6px; background:#FF7A00; margin:42px 0 36px; }
  .subtitle{ font-size:38px; line-height:1.55; font-weight:400; color:rgba(255,255,255,.9); max-width:820px; }
  .intro{ margin-top:28px; font-size:32px; line-height:1.7; font-weight:400; color:rgba(255,255,255,.78); max-width:820px; padding-left:26px; border-left:4px solid #FF7A00; }
  .foot{
    margin-top:auto; position:relative; z-index:2;
    padding-top:28px; border-top:1px solid rgba(255,255,255,.4);
    display:flex; justify-content:space-between; align-items:center;
    font-size:26px; color:rgba(255,255,255,.82);
  }
  .brand{ font-weight:600; color:#fff; letter-spacing:.02em; }
</style>
</head>
<body>
  <div class="cover">
    <img class="bg" src="{{bg}}">
    <div class="mask"></div>
    <div class="note">先收藏<br>慢慢看</div>
    <div><span class="tag">{{tag}}</span></div>
    <div class="mid">
      <div class="title">{{title}}</div>
      <div class="rule"></div>
      <div class="subtitle">{{subtitle}}</div>
      <div class="intro">{{intro}}</div>
    </div>
    <div class="foot">
      <span class="brand">新东方 · 教培新媒体</span>
      <span>家长都在看</span>
    </div>
  </div>
</body>
</html>
